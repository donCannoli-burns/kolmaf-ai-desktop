[project]
name = "kolmafa"
version = "0.1.0"
description = "Lean OpenCode to KoLmafia GCLI bridge with SQLite RAG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
web = [
    "sqlite-web>=0.6.4",
]
vec = [
    "sqlite-vec>=0.1.0",
]

[project.scripts]
kolmafa = "kolmafa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kolmafa"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:langsmith_plugin"]
markers = [
    "external_integration: asserts the real external provider constellation or sibling workspaces; excluded from the portable CI gate",
    "local_runtime: requires machine-local installed state (generated data/runtime registry, installed ~/.kolmafia targets); excluded from the portable CI gate",
    "local_artifact: requires intentionally non-public historical/source evidence artifacts (KOLMAF_PRIVATE_EVAL_ROOT); excluded from the portable CI gate",
    "legacy: superseded historical test retained for reference; excluded from the portable CI gate",
]
